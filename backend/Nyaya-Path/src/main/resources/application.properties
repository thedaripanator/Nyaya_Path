# Spring Boot application properties for Nyaya-Path
spring.config.import=optional:file:.env[.properties]

# Server configuration
server.port=8100

# JWT configuration (JWT_SECRET is required and must be at least 32 characters)
nyaya.jwt.expiration-ms=${NYAYA_JWT_EXPIRATION_MS:86400000}
nyaya.cookie.secure=${NYAYA_COOKIE_SECURE:false}
nyaya.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Backend service URLs
nyaya.ml-service.url=${ML_SERVICE_URL:http://127.0.0.1:8001}

# PostgreSQL connection. Set DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nyaya_path}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Secrets are required in the process environment.
nyaya.jwt.secret=${JWT_SECRET}
nyaya.ml-service.api-key=${ML_SERVICE_API_KEY}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
